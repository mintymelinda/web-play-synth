server {
    listen 80;
    server_name _;

    root /srv/synth/current;
    index index.html;

    # Vite's content-hashed assets are retained across releases, so a tab
    # running an older app can still fetch its original JS and CSS bundles.
    location /assets/ {
        alias /srv/synth/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never let a browser keep an old entry point after a release switch.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
