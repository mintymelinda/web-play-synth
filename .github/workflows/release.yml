name: Windows VST3 Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure native plugin and smoke tests
        run: cmake -S plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build VST3 and Standalone
        run: cmake --build build/plugin --config Release --parallel

      - name: Run native audio, MIDI, and state tests
        run: ctest --test-dir build/plugin -C Release --output-on-failure

      - name: Verify plugin formats and target architecture
        run: python scripts/verify_native_package.py --platform windows-x86_64 --root build/plugin/WebPlaySynth_artefacts/Release

      - name: Download pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive -Path pluginval.zip -DestinationPath pluginval-bin

      - name: Validate VST3 with pluginval
        shell: cmd
        run: pluginval-bin\pluginval.exe --validate-in-process --strictness-level 5 --validate "build\plugin\WebPlaySynth_artefacts\Release\VST3\Web Play Synth.vst3"

      - name: Package Windows plugin and Standalone
        shell: pwsh
        run: Compress-Archive -Path build/plugin/WebPlaySynth_artefacts/Release/VST3,build/plugin/WebPlaySynth_artefacts/Release/Standalone -DestinationPath web-play-synth-windows-x86_64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: web-play-synth-windows-x86_64
          path: web-play-synth-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Windows GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require release tag to point to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: web-play-synth-windows-x86_64
          path: release-assets

      - name: Verify Windows download is present
        run: test -s release-assets/web-play-synth-windows-x86_64.zip

      - name: Create GitHub Release and attach Windows download
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/web-play-synth-windows-x86_64.zip
