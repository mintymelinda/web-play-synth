name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check deployment scripts
        run: bash -n scripts/deploy.sh scripts/rollback.sh

  browser-audio:
    name: Browser audio playback (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test real Web Audio output
        run: npm run test:browser

  native-vst3:
    name: Native VST3 (linux-x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libgl1-mesa-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure native plugin and smoke tests
        run: |
          cmake -S plugin -B build/plugin \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON

      - name: Build VST3, Standalone, and smoke test
        run: cmake --build build/plugin --config Release --parallel 2

      - name: Run native audio and MIDI smoke tests
        run: ctest --test-dir build/plugin -C Release --output-on-failure

      - name: Verify audio from the built VST3 through a JUCE host
        run: |
          xvfb-run --auto-servernum ctest --test-dir build/plugin -C Release \
            -R native-vst3-host-audio --output-on-failure

      - name: Verify plugin formats and target architecture
        run: |
          python scripts/verify_native_package.py \
            --platform linux-x86_64 \
            --root "build/plugin/WebPlaySynth_artefacts/Release"

      - name: Download pluginval
        run: |
          curl --fail --location --retry 3 \
            https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip \
            --output pluginval.zip
          mkdir -p pluginval-bin
          unzip -q pluginval.zip -d pluginval-bin
          chmod +x pluginval-bin/pluginval

      - name: Validate VST3 with pluginval
        run: |
          xvfb-run --auto-servernum pluginval-bin/pluginval \
            --validate-in-process --strictness-level 5 \
            --validate "build/plugin/WebPlaySynth_artefacts/Release/VST3/Web Play Synth.vst3"

      - name: Package Linux plugin formats
        run: |
          tar -czf web-play-synth-linux-x86_64.tar.gz \
            -C build/plugin/WebPlaySynth_artefacts/Release VST3 Standalone

      - name: Upload Linux plugin package
        uses: actions/upload-artifact@v4
        with:
          name: web-play-synth-linux-x86_64
          path: web-play-synth-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14

