name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check deployment scripts
        run: bash -n scripts/deploy.sh scripts/rollback.sh

  native-vst3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libgl1-mesa-dev
      - name: Configure native plugin and smoke tests
        run: cmake -S plugin -B build/plugin -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build VST3, Standalone, and smoke test
        run: cmake --build build/plugin --config Release --parallel 2
      - name: Run native audio and MIDI smoke test
        run: ctest --test-dir build/plugin -C Release --output-on-failure
      - name: Package Linux plugin formats
        run: |
          tar -czf web-play-synth-linux-x86_64.tar.gz \
            -C build/plugin/WebPlaySynth_artefacts/Release VST3 Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: web-play-synth-linux-x86_64
          path: web-play-synth-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
