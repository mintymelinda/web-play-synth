services:
  web-play-synth:
    build:
      context: .
      target: runtime
    image: web-play-synth:local
    ports:
      - "${SYNTH_PORT:-4173}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
