services:
  web-play-synth:
    image: nginx:1.27-alpine
    ports:
      - "${SYNTH_PORT:-4173}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SYNTH_DATA_DIR:-./data}:/srv/synth:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
